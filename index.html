<style>
html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Background */

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center,
        #111 0%,
        #050505 50%,
        #000 100%);
}

/* Bond-ish light sweep */

.spotlight {
    position: fixed;
    inset: -50%;
    background:
        linear-gradient(
            105deg,
            transparent 45%,
            rgba(255,255,255,.08) 50%,
            transparent 55%
        );

    transform: translateX(-150%) rotate(-10deg);
    animation: sweep 3s ease-out forwards;
}

@keyframes sweep {
    from {
        transform: translateX(-150%) rotate(-10deg);
    }
    to {
        transform: translateX(150%) rotate(-10deg);
    }
}

.container {
    position: relative;
    z-index: 2;
    text-align: center;
}

/* Logo */

.logo {
    font-size: 38px;
    font-weight: 300;
    letter-spacing: .35em;
    text-transform: uppercase;

    opacity: 0;
    transform: translateY(8px);

    animation: logoReveal 1.5s ease forwards;
    animation-delay: .4s;
}

@keyframes logoReveal {
    from {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
    }
}

.subtitle {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: .5em;
    text-transform: uppercase;
    color: #888;

    opacity: 0;
    animation: fadeIn .8s forwards;
    animation-delay: 1.1s;
}

.rule {
    width: 0;
    height: 1px;
    margin: 32px auto;
    background: linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.8),
        transparent
    );

    animation: ruleDraw .8s forwards;
    animation-delay: 1.4s;
}

@keyframes ruleDraw {
    to {
        width: 240px;
    }
}

/* Links */

.nav {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.nav-label {
    color: #888;
    text-transform: uppercase;
    letter-spacing: .35em;
    font-size: 11px;

    opacity: 0;
    animation: navIn .6s forwards;
    animation-delay: 1.9s;
}

.nav a {
    color: #ddd;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: .25em;
    font-size: 13px;

    opacity: 0;
    transform: translateY(12px);

    transition: color .25s ease;
}

.nav a.app {
    font-size: 12px;
    color: #bbb;
    letter-spacing: .2em;
}

.nav a:hover {
    color: white;
}

.nav a:nth-of-type(1) { animation: navIn .6s forwards; animation-delay: 2.0s; }
.nav a:nth-of-type(2) { animation: navIn .6s forwards; animation-delay: 2.15s; }
.nav a:nth-of-type(3) { animation: navIn .6s forwards; animation-delay: 2.35s; }
.nav a:nth-of-type(4) { animation: navIn .6s forwards; animation-delay: 2.5s; }

@keyframes navIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

/* Film grain */

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .15;

    background-image:
        repeating-radial-gradient(
            circle at 0 0,
            rgba(255,255,255,.03),
            rgba(255,255,255,.03) 1px,
            transparent 2px,
            transparent 4px
        );
}

/* Vignette */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.7) 100%
        );
}
</style>
</head>

<div class="background"></div>
<div class="spotlight"></div>

<div class="container">

    <div class="logo">
        ralph-e-boy apps
    </div>

    <div class="subtitle">
        Independent Software
    </div>

    <div class="rule"></div>

    <nav class="nav">
        <span class="nav-label">Apps</span>

</div>
